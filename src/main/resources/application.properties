# 접속 정보는 환경 변수로 바꿀 수 있다. 아래 기본값은 Oracle 21c XE 로컬 실습 예시(서비스명: XE, 공통 사용자: C##SECURE)이며 실제 운영 계정 정보를 넣지 않는다.
spring.datasource.url=${LAB_DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
spring.datasource.username=${LAB_DB_USER:C##SECURE}
spring.datasource.password=${LAB_DB_PASSWORD:SECURE}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JSP View Resolver 설정
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# AES-128 키(Base64). SecurityPracticeTest.generateAesKey() 실행 후 출력된 키를 환경 변수 LAB_AES_KEY 또는 아래 값에 넣는다.
lab.aes-key=${LAB_AES_KEY:R7QP8B1c1v6GI1sGUeYvUA}

# 로깅 레벨 설정
logging.level.edu.secure.lab=INFO
